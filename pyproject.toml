[project]
name = "tech-jobs-radar"
version = "0.1.0"
description = "Radar autônomo de inteligência de mercado e oportunidades em Engenharia de Dados (Padrão EY / Big 4)"
readme = "README.md"
authors = [
    { name = "David Almeida", email = "davidgralmeida@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "tenacity>=8.5.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.1",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.108.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "data",
    "tools",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (erros de sintaxe e variáveis não utilizadas)
    "I",      # isort (ordenação alfabética e categorizada de imports)
    "UP",     # pyupgrade (modernização sintática para Python 3.11+)
    "B",      # flake8-bugbear (bugs comuns de design e performance)
    "SIM",    # flake8-simplify (simplificação de condicionais)
    "T20",    # flake8-print (proíbe print() solto em código de produção)
    "ASYNC",  # flake8-async (detecção de anti-padrões assíncronos)
]
ignore = [
    "E501",   # Deixa quebra de linha longa sob responsabilidade do ruff format
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
